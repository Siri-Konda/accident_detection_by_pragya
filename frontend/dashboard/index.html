<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Accident Detection</title>

    
    <style>
        :root {
            --bg-color: #8bbfd3;
            --card-bg: rgba(30, 33, 40, 0.7);
            --text-main: #f8f9fa;
            --text-muted: #0f0f10;
            --accent-red: rgba(96,96,255);
            --accent-green: #10b981;
            --accent-green-bg: rgba(16, 185, 129, 0.15);
        }

        body { 
            font-family: 'Arial', sans-serif; 
            background-color: rgb(152,152,255); 
            background-attachment: fixed;
            color: var(--text-main); 
            text-align: center; 
            margin: 0;
            padding: 0;
        }

        .headbox{
            display: flex ;
            justify-content: space-between;
            align-items: center;
            height: 4%;
            width: auto;
            padding: 20px 50px;
            background-color: #fdfdfd;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 5px solid rgb(96,96,255);
        }


        h1 { 
            margin: 0 0 10px 0; 
            font-size: 2.5rem;
            color: rgb(96,96,255);
            font-weight: 700;
            padding-top: 10px;
            padding-bottom: 10px;
            letter-spacing: 0.05em;
        }

        h2{
            color: rgb(18, 18, 36);
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        
        .start-btn { 
            margin: 10px 0 50px 0; 
            padding: 14px 36px; 
            font-size: 16px; 
            font-weight: 600; 
            background: linear-gradient(135deg, rgb(93, 93, 252), rgb(73, 73, 252)); 
            color: white; 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 8px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(96, 96, 255, 0.3);
            transition: all 0.3s ease;
        }
        .start-btn:hover { 
            transform: translateY(-2px); 
        }

        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 30px; 
            max-width: 1400px;
            margin: 0 auto;
            justify-items: center;
        }

        
        .card { 
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; 
            padding: 20px; 
            
            width: 100%; 
            max-width: 640px; 
            box-sizing: border-box;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .location-badge {
            background-color: var(--accent-green-bg);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .cam-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cam-id {
            font-size: 13px;
            color: var(--text-main);
            font-family: Arial, sans-serif;
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-red);
            letter-spacing: 1px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            background-color: #050505;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .video-stream { 
            width: 100%; 
            height: 100%;
            object-fit: contain; 
            z-index: 1;
            transition: opacity 0.5s ease;
        }

        .video-stream[alt="Waiting to start..."] {
            opacity: 0.3;
            filter: grayscale(100%);
        }

        .logs-section {
            max-width: 1400px;
            margin: 40px auto 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        .logs-section h2 {
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            color: #fff;
        }

        #log-list {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 10px;
        }

        
        #log-list::-webkit-scrollbar {
            width: 8px;
        }
        #log-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        #log-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .log-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(0,0,0,0.4);
            border-left: 4px solid #666;
            font-size: 14px;
        }

        
        .log-item.accident { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.15); }
        .log-item.fire { border-left-color: #f97316; background: rgba(249, 115, 22, 0.15); }
        .log-item.offline { border-left-color: #9ca3af; }

        .log-time { color: #a1a1aa; font-family: monospace; white-space: nowrap; }
        .log-loc { font-weight: 600; color: #8bbfd3; white-space: nowrap; }
        .log-msg { color: #fff; }
    </style>
    <div class="headbox">
        <h1>PRAGYA</h1>
    </div>
</head>
<body>
    <h1>Real-Time Accident Detection</h1>
    <p class="subtitle">Monitoring live highway surveillance feeds</p>
    
    <button class="start-btn" onclick="startStreams()">Initialize Surveillance Feeds</button>
    
    <div class="grid">
        {% for video in videos %}
        <div class="card">
            
            <div class="card-header">
                <span class="location-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    {{ video.camera_location | title }}
                </span>
                
                <div class="cam-info">
                    <span class="cam-id">CAM: {{ video.camera_id }}</span>
                    <div class="live-indicator">
                        <div class="pulse-dot"></div>
                        LIVE
                    </div>
                </div>
            </div>
            
            <div class="video-container">
                <img class="video-stream" data-src="/video_feed/{{ video.video_filename }}" alt="Waiting to start...">
            </div>
            
        </div>
        {% endfor %}
    </div>

    <!-- --- NEW: Logs Section --- -->
    <div class="logs-section">
        <h2>System Activity Logs</h2>
        <div id="log-list">
            <div class="log-item">
                <span class="log-msg" style="color: #a1a1aa;">Waiting for system initialization...</span>
            </div>
        </div>
    </div>

    <script>
        let logInterval;

        function startStreams() {
            // 1. Start the video feeds
            const images = document.querySelectorAll('.video-stream');
            images.forEach(img => {
                if (!img.src || img.src.includes("Waiting")) {
                    img.src = img.getAttribute('data-src');
                    img.style.opacity = '1';
                    img.style.filter = 'none';
                }
            });
            
            // 2. Hide button with a smooth fade
            const btn = document.querySelector('.start-btn');
            btn.style.opacity = '0';
            setTimeout(() => btn.style.display = 'none', 300);

            // 3. Start fetching logs periodically
            if (!logInterval) {
                fetchLogs(); // run immediately
                logInterval = setInterval(fetchLogs, 2000); // then every 2 seconds
            }
        }

        // --- NEW: Fetch and render logs ---
        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs');
                const logs = await response.json();
                renderLogs(logs);
            } catch (error) {
                console.error("Error fetching logs:", error);
            }
        }

        function renderLogs(logs) {
            const container = document.getElementById('log-list');
            
            if (logs.length === 0) {
                container.innerHTML = `<div class="log-item"><span class="log-msg" style="color: #a1a1aa;">System active. Monitoring feeds...</span></div>`;
                return;
            }

            container.innerHTML = ''; // Clear current list
            
            logs.forEach(log => {
                const item = document.createElement('div');
                // Apply specific class based on event type to trigger CSS styling
                item.className = `log-item ${log.event_type.toLowerCase()}`;
                
                item.innerHTML = `
                    <span class="log-time">${log.timestamp}</span>
                    <span class="log-loc">[${log.location} - CAM: ${log.camera_id}]</span>
                    <span class="log-msg"><strong>${log.event_type}</strong>: ${log.details}</span>
                `;
                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
