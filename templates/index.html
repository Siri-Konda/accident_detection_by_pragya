<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Accident Detection</title>
    <!-- Import a modern font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: rgba(30, 33, 40, 0.7);
            --text-main: #f8f9fa;
            --text-muted: #9ca3af;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-green-bg: rgba(16, 185, 129, 0.15);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(circle at 50% 0%, #1f222b 0%, #0f1115 100%);
            background-attachment: fixed;
            color: var(--text-main); 
            text-align: center; 
            margin: 0;
            padding: 40px 20px;
        }

        h1 { 
            margin: 0 0 10px 0; 
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        /* Modern Button Styling */
        .start-btn { 
            margin: 10px 0 50px 0; 
            padding: 14px 36px; 
            font-size: 16px; 
            font-weight: 600; 
            background: linear-gradient(135deg, #ef4444, #dc2626); 
            color: white; 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 8px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            transition: all 0.3s ease;
        }
        .start-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
            background: linear-gradient(135deg, #f87171, #ef4444); 
        }

        /* STRICT 2-COLUMN GRID */
        .grid { 
            display: grid; 
            /* Forces exactly 2 columns minimum. Change to repeat(auto-fit, minmax(400px, 1fr)) for more dynamic scaling */
            grid-template-columns: repeat(2, 1fr); 
            gap: 30px; 
            max-width: 1400px;
            margin: 0 auto;
            justify-items: center; /* Centers the cards nicely */
        }

        /* Responsive Cards */
        .card { 
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; 
            padding: 20px; 
            
            /* Allow the card to shrink/grow based on screen size, but cap it at your 640px video res */
            width: 100%; 
            max-width: 640px; 
            box-sizing: border-box;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        /* Metadata Header */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .location-badge {
            background-color: var(--accent-green-bg);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
            white-space: nowrap; /* Prevents text from breaking */
        }

        .cam-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cam-id {
            font-size: 13px;
            color: var(--text-muted);
            font-family: 'Inter', monospace;
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* Pulsing Live Indicator */
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-red);
            letter-spacing: 1px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Responsive Aspect-Ratio Video Container */
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9; /* Perfect 640x360 ratio constraint */
            height: auto;
            background-color: #050505;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .video-stream { 
            width: 100%; 
            height: 100%;
            object-fit: contain; 
            z-index: 1;
        }

        /* Placeholder styling for before the stream starts */
        .video-stream[alt="Waiting to start..."] {
            opacity: 0.3;
            filter: grayscale(100%);
        }
    </style>
</head>
<body>
    <h1>Real-Time Accident Detection</h1>
    <p class="subtitle">Monitoring live highway surveillance feeds</p>
    
    <button class="start-btn" onclick="startStreams()">Initialize Surveillance Feeds</button>
    
    <div class="grid">
        {% for video in videos %}
        <div class="card">
            
            <!-- Dynamic UI elements pulling from the JSON data -->
            <div class="card-header">
                <span class="location-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    {{ video.camera_location | title }}
                </span>
                
                <div class="cam-info">
                    <span class="cam-id">CAM: {{ video.camera_id }}</span>
                    <div class="live-indicator">
                        <div class="pulse-dot"></div>
                        LIVE
                    </div>
                </div>
            </div>
            
            <div class="video-container">
                <img class="video-stream" data-src="/video_feed/{{ video.video_filename }}" alt="Waiting to start...">
            </div>
            
        </div>
        {% endfor %}
    </div>

    <script>
        function startStreams() {
            const images = document.querySelectorAll('.video-stream');
            images.forEach(img => {
                if (!img.src || img.src.includes("Waiting")) {
                    img.src = img.getAttribute('data-src');
                    img.style.opacity = '1';
                    img.style.filter = 'none';
                }
            });
            // Hide button with a smooth fade
            const btn = document.querySelector('.start-btn');
            btn.style.opacity = '0';
            setTimeout(() => btn.style.display = 'none', 300);
        }
    </script>
</body>
</html>
